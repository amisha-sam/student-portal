{% extends "base.html" %}
{% block title %}Sign In &bull; Student Performance Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card p-4 shadow-sm border-0">
      <div class="text-center mb-4">
        <div class="p-3 bg-primary-subtle text-primary rounded-circle d-inline-flex mb-2">
          <i class="bi bi-mortarboard-fill fs-2"></i>
        </div>
        <h3 class="fw-bold text-dark">Portal Sign In</h3>
        <p class="text-muted small">Access student marks, grading and support records</p>
      </div>

      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted">Username / Roll No</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="e.g. admin, teacher, R001" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-muted">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>
    </div>

    <!-- Demo Credentials Helper for Jury / Demo -->
    <div class="card mt-3 bg-light border p-3">
      <div class="d-flex align-items-center gap-2 mb-2 text-muted fw-semibold small">
        <i class="bi bi-info-circle-fill text-primary"></i> Demo Credentials
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-borderless small mb-0">
          <tbody>
            <tr>
              <td class="text-muted">Administrator:</td>
              <td><code>admin</code></td>
              <td><code>admin123</code></td>
            </tr>
            <tr>
              <td class="text-muted">Teacher:</td>
              <td><code>teacher</code></td>
              <td><code>teacher123</code></td>
            </tr>
            <tr>
              <td class="text-muted">Student:</td>
              <td><code>R001</code></td>
              <td><code>student123</code></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
