{% extends "base.html" %}
{% block title %}404 Not Found &bull; Student Performance Portal{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5">
  <div class="col-md-6">
    <div class="p-4 bg-white rounded-4 shadow-sm border">
      <div class="text-primary display-1 fw-bold mb-2">404</div>
      <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
      <p class="text-muted mb-4">The requested page or student record could not be found. Please check the URL or return to the dashboard.</p>
      <a href="/" class="btn btn-primary px-4">
        <i class="bi bi-house-door me-1"></i> Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
